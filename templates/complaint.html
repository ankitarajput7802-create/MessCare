<!DOCTYPE html>
<html>
<head>
    <title>Raise Complaint - MessCare</title>
</head>

<body>

    <h1>🍽️ Raise a Complaint</h1>

    <p>Tell us about your mess-related problem.</p>

    <form action="/submit-complaint" method="POST">

        <label>Complaint Type:</label>

        <select name="complaint_type">
            <option>Food Quality</option>
            <option>Hygiene</option>
            <option>Food Timing</option>
            <option>Other</option>
        </select>

        <br><br>

        <label>Description:</label>
        <br>

        <textarea  name="description" rows="5" cols="40" placeholder="Describe your complaint..."></textarea>
         <br><br>

<button type="submit">Submit Complaint</button>
    </form>

</body>
</html>
